# Lab 9: Jenkins with Python build tooling. The repository is mounted read-only so
# the pipeline can run from your local commits (file:///repo-src) before you push.
name: lab9

services:
  jenkins:
    build: jenkins
    container_name: lab9-jenkins
    environment:
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD (see .env.example)}
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8080}:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Repository root (two levels up from this lab), read-only.
      - ../..:/repo-src:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  jenkins_home:
