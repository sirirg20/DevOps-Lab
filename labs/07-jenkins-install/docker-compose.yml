# Lab 7, unattended mode: Jenkins with preinstalled plugins and an admin user
# created from environment variables.
name: lab7

services:
  jenkins:
    build: .
    container_name: lab7-jenkins
    environment:
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD (see .env.example)}
    ports:
      # Bound to loopback so the controller is not exposed to the network.
      - "127.0.0.1:${JENKINS_PORT:-8080}:8080"
      # Port 50000 (inbound agents over JNLP/TCP) is intentionally not published:
      # nothing in this lab connects an agent. Add "50000:50000" when you do.
    volumes:
      # Named volume: jobs, config, credentials and plugins survive container removal.
      - jenkins_home:/var/jenkins_home
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  jenkins_home:
