# Lab 8: Jenkins with the Git plugin and a local sample repository mounted read-only.
name: lab8

services:
  jenkins:
    build: .
    container_name: lab8-jenkins
    environment:
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD (see .env.example)}
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8080}:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Created by make_sample_repo.sh; the job reads it as file:///sample-repo.
      - ./.work/devops-sample-code:/sample-repo:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  jenkins_home:
