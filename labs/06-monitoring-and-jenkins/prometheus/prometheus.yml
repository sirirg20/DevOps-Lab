global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # "exporter" is the Compose service name; Docker DNS resolves it.
  - job_name: delivery_service
    static_configs:
      - targets: ["exporter:8000"]
