apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-cart
  namespace: lab10
  labels:
    app: shopping-cart
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shopping-cart
  template:
    metadata:
      labels:
        app: shopping-cart
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: shopping-cart
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: shopping-cart
          image: lab10/shopping-cart:1.0
          imagePullPolicy: Never
          env:
            # Carts live in Redis so every replica shows the same cart.
            - name: REDIS_HOST
              value: redis
          ports:
            - containerPort: 8080
          # Ready only when Redis answers; alive as long as the process runs.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: shopping-cart
  namespace: lab10
  labels:
    app: shopping-cart
spec:
  type: NodePort
  selector:
    app: shopping-cart
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shopping-cart
  namespace: lab10
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: shopping-cart
