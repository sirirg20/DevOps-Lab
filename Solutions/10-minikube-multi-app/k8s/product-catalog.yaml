apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: lab10
  labels:
    app: product-catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-catalog
  template:
    metadata:
      labels:
        app: product-catalog
    spec:
      # Spread replicas across nodes. ScheduleAnyway keeps the app schedulable
      # when a node is lost, which a "required" anti-affinity rule would not.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: product-catalog
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: product-catalog
          image: lab10/product-catalog:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  namespace: lab10
  labels:
    app: product-catalog
spec:
  type: NodePort
  selector:
    app: product-catalog
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: product-catalog
  namespace: lab10
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: product-catalog
